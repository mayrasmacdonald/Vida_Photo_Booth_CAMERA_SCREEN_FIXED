<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ead6bd">
<link rel="stylesheet" href="./styles.css">
<title>Vida 10 jaar | Photo Booth</title>
<style>
:root{--beige:#ead6bd}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--beige)}
body{overflow-x:hidden;font-family:Arial,sans-serif}
button{font:inherit}
.screen{min-height:100svh;width:100%;display:grid;place-items:center}
.hidden{display:none!important}
.board{position:relative;width:min(100vw,460px);height:auto;aspect-ratio:853/1844;overflow:hidden}
.board>img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none}
.invisible-hit{position:absolute;border:0;background:transparent;padding:0;margin:0;z-index:50;cursor:pointer;appearance:none}
.invisible-hit:focus-visible{outline:3px solid rgba(200,148,50,.95);outline-offset:3px;border-radius:999px}

/* Camera uses the same approved artwork. Only the live video occupies the portrait photo area. */
.camera-board{position:relative;width:min(100vw,430px);height:min(100svh,calc(100vw * 1844 / 853));aspect-ratio:853/1844;overflow:hidden}
.camera-board .art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.live-window{position:absolute;left:7.50%;top:7.97%;width:81.95%;height:48.26%;overflow:hidden;border:2px solid rgba(200,148,50,.92);border-radius:7px;z-index:10;background:#ddd}
.live-window video{width:100%;height:100%;display:block;object-fit:cover;transform:scaleX(-1)}
#countdown{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:clamp(90px,26vw,160px);font-weight:700;text-shadow:0 5px 18px rgba(0,0,0,.35);pointer-events:none;z-index:20}
.camera-capture{position:absolute;left:13%;top:79%;width:74%;height:8%;border:0;background:transparent;color:transparent;z-index:60;cursor:pointer}
.camera-back{position:absolute;left:4%;top:93%;width:92%;height:4%;border:0;background:transparent;color:transparent;z-index:60}

/* Exact approved result artwork. The photo is inserted only into its transparent window. */
.result-board{position:relative;width:min(100vw,460px);height:auto;aspect-ratio:1086/1448;overflow:hidden}
.result-photo{position:absolute;left:12.80%;top:11.33%;width:71.65%;height:47.79%;object-fit:cover;object-position:center;z-index:1}
.result-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:2;pointer-events:none}
.result-logo{position:absolute;left:5.25%;top:2.90%;width:7.92%;height:auto;z-index:4;pointer-events:none}
.result-hit{position:absolute;z-index:20;border:0;background:transparent;padding:0;cursor:pointer}
.result-hit:focus-visible{outline:3px solid rgba(200,148,50,.95);outline-offset:3px;border-radius:999px}
.again-hit{left:9.2%;top:84.15%;width:36.8%;height:7.3%}
.save-hit{left:48.2%;top:84.15%;width:42.4%;height:7.3%}
.share-hit{left:9.2%;top:91.0%;width:82.3%;height:7.2%}
.status{position:fixed;left:10px;right:10px;bottom:8px;text-align:center;font-size:12px;color:#7b2f09;z-index:100;pointer-events:none}
@media (min-width:700px){.board,.camera-board,.result-board{width:min(430px,70vw)}}
</style>
</head>
<body>
<main>
<section id="welcome" class="screen">
  <div class="board">
    <img src="./assets/images/photo-booth-start.png" alt="Vida 10 jaar photo booth">
    <button id="start" class="invisible-hit" style="left:12%;top:79%;width:76%;height:9%" aria-label="Start camera"></button>
  </div>
</section>

<section id="camera" class="screen hidden">
  <div class="camera-board">
    <img class="art" src="./assets/images/photo-booth-camera.png" alt="">
    <div class="live-window">
      <video id="video" autoplay playsinline muted></video>
      <div id="countdown" aria-live="assertive"></div>
    </div>
    <div class="camera-controls" aria-label="Camerabediening">
      <button id="back" class="camera-control camera-back-visible" aria-label="Terug naar welkom">
        <span aria-hidden="true">←</span>
      </button>
      <button id="take" class="camera-control camera-shutter" aria-label="Foto maken">
        <span class="camera-icon" aria-hidden="true"></span>
      </button>
      <button id="flip" class="camera-control camera-flip" aria-label="Camera wisselen">
        <span aria-hidden="true">↺</span>
      </button>
    </div>
  </div>
</section>

<section id="result" class="screen hidden">
  <div class="result-board">
    <img id="capturedPhoto" class="result-photo" alt="Jouw foto">
    <img class="result-art" src="./assets/images/photo-booth-result-overlay.png" alt="">
    <img class="result-logo" src="./assets/images/cbm-logo-exact.png" alt="CBM">
    <button id="again" class="result-hit again-hit" aria-label="Opnieuw"></button>
    <button id="save" class="result-hit save-hit" aria-label="Foto opslaan"></button>
    <button id="share" class="result-hit share-hit" aria-label="Delen"></button>
  </div>
</section>
</main>
<p id="message" class="status" aria-live="polite"></p>
<canvas id="captureCanvas" hidden></canvas>
<script src="./app.js"></script>
</body>
</html>
